name: Import pnpm-lock
on:
  workflow_dispatch:
permissions:
  contents: write
jobs:
  import:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: curl -fsSL -o pnpm-lock.yaml "https://litter.catbox.moe/axu8z1.yaml"
      - run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add pnpm-lock.yaml
          git commit -m "Add pnpm-lock.yaml" || exit 0
          git push
